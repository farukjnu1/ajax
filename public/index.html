<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>Get Submit</title>
    <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <!--<script src="jquery/jquery.min.js"></script>-->
    <style>
        input {
            margin: 5px;
              }
    </style>
    <script>
        $(document).ready(() => {
            $("#send").click(() => {
                if(validateFormData()==true){
                        $.ajax({
                        url: "/ajax",
                        type: "get",
                        dataType: "json",
                        data: {
                            name: $("#name").val(), 
                            email: $("#email").val(), 
                            phone:$("#phone").val()
                        },
                        success: (result) => {
                            $("#output").html(`
                            Server Message: ${result.message}
                            <br />
                            Name: ${result.name} 
                            <br />
                            Email: ${result.email}
                            <br />
                            Phone: ${result.phone}`);
                            $("#output").show();
                        }
                    });   
                }
            });
        });

        function validateFormData(){
            var isValid = true;
            var name = $("#name").val();
            var email = $("#email").val();
            var phone = $("#phone").val();
            if(name==null || name ==""){
                isValid = false;
                alert("Name is required");
            }else if(email==null || email ==""){
                isValid = false;
                alert("Email is required");
            }else if(phone==null || phone ==""){
                isValid = false;
                alert("Phone is required");
            }
            return isValid;
        }
    </script>
</head>
<body>
    <header>
        <h1>Bangladesh</h1>
        <h2><a href="index.html">Home</a>||<a href="history.html">History of  Bangladesh</a>||<a href="natural.html">Natural Bangladesh</a>||<a href="contact.html">Contact Us</a></h2>
   </header>
    <div id="container">
        <nav>
            <h3>Amar Bangla</h3>
            <a href="index.html">Home</a>
            <a href="history.html">History of Bangladesh</a>
            <a href="natural.html">Natural Bangladesh</a>
            <a href="contact.html">Contact Us</a>
        </nav>
        <section>
            <article>
                <header>
                    <h1>Welcom in Amar Bangla Web.......</h1>
                </header>
                <form action="#" method="post">
                    <label>Name:</label><br>
                    <input type="text" id="name" name="name"><br>
                    <label>Email:</label><br>
                    <input type="text" id="email" name="email"><br>
                    <label>Phone:</label><br>
                    <input type="text" id="phone" name="phone"><br><br>
                    <button id="send" type="button">Submit</button><br><br>
                    <div id="output" style="display:none">
                    </div>
                </form>
                
                <footer>
                    <h2>&nbsp;</h2>
                </footer>
            </article>
        </section>
        <aside>
            <h3>News of Bangla</h3>
            <p>17 more body recovered, death toll new 405</p>
        </aside>
        <footer>
            <h2>copyright by amarbagla.com</h2>
        </footer>
    </div>
</body>
</html>
